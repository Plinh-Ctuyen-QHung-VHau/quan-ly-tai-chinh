name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Hủy run cũ cùng branch khi có run mới hơn
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend ──────────────────────────────────────────────────────
  api-gateway:
    name: API Gateway – Lint / Build / Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/api-gateway/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test (passWithNoTests – placeholder cho test case sau)
        run: npm test -- --passWithNoTests

  identity-service:
    name: Identity Service – Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/identity-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/identity-service/package-lock.json
      - run: npm ci
      - run: npm run build

  transaction-service:
    name: Transaction Service – Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/transaction-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/transaction-service/package-lock.json
      - run: npm ci
      - run: npm run build

  ocr-service:
    name: OCR Service – Build
    # Dùng bookworm vì Dockerfile của ocr-service cũng dùng node:18-bookworm (cần apt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ocr-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/ocr-service/package-lock.json
      - run: npm ci
      - run: npm run build

  budget-notification-service:
    name: Budget Notification Service – Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/budget-notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/budget-notification-service/package-lock.json
      - run: npm ci
      - run: npm run build

  finance-intelligence:
    name: Finance Intelligence – Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/finance-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/finance-intelligence/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Run unit tests
        # tsx chạy file .ts trực tiếp; node:test tự kích hoạt khi file được thực thi
        run: npx tsx src/anomaly/anomaly.detector.spec.ts

  # ─── Frontend ──────────────────────────────────────────────────────
  frontend:
    name: Frontend – Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck

  # ─── Job tổng hợp (gate) ───────────────────────────────────────────
  # CD workflow chỉ chạy khi job này thành công
  # Dùng làm required status check trong branch protection rules
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs:
      - api-gateway
      - identity-service
      - transaction-service
      - ocr-service
      - budget-notification-service
      - finance-intelligence
      - frontend
    steps:
      - run: echo "Tất cả CI jobs đã pass ✓"

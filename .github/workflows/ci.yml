name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-gateway:
    name: API Gateway – Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/api-gateway/package-lock.json
      - run: npm ci
      - run: npm run build

  identity-service:
    name: Identity Service – Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/identity-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run build

  transaction-service:
    name: Transaction Service – Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/transaction-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/transaction-service/package-lock.json
      - run: npm ci
      - run: npm run build

  ocr-service:
    name: OCR Service – Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ocr-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/ocr-service/package-lock.json
      - run: npm ci
      - run: npm run build

  budget-notification-service:
    name: Budget Notification Service – Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/budget-notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/budget-notification-service/package-lock.json
      - run: npm ci
      - run: npm run build

  finance-intelligence:
    name: Finance Intelligence – Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/finance-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/finance-intelligence/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend:
    name: Frontend – Install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs:
      - api-gateway
      - identity-service
      - transaction-service
      - ocr-service
      - budget-notification-service
      - finance-intelligence
      - frontend
    steps:
      - run: echo "Tất cả CI jobs đã pass ✓"

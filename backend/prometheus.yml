global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: "backend"
    environment: "development"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "/etc/prometheus/alert-rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:3000"]
    metrics_path: /api/metrics
    scrape_interval: 15s

  - job_name: "identity-service"
    static_configs:
      - targets: ["identity-service:3001"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "transaction-service"
    static_configs:
      - targets: ["transaction-service:3002"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "ocr-service"
    static_configs:
      - targets: ["ocr-service:3003"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "budget-notification-service"
    static_configs:
      - targets: ["budget-notification-service:3004"]
    metrics_path: /metrics
    scrape_interval: 15s

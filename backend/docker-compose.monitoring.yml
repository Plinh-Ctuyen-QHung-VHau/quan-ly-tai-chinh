version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v2.37.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - app-network

  grafana:
    image: grafana/grafana:8.5.2
    ports:
      - "3005:3000" # Đổi cổng Grafana để tránh xung đột với API Gateway
    depends_on:
      - prometheus
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: backend_app-network # Tham chiếu đến network đã tạo bởi docker-compose.yml

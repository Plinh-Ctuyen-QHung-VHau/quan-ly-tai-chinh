# Alertmanager Configuration
# This is a basic setup for alert notifications

global:
  resolve_timeout: 5m
  slack_api_url: https://hooks.slack.com/services/CHANGE/ME/REPLACE

route:
  receiver: "default"
  repeat_interval: 1h
  group_interval: 5m
  group_wait: 10s
  routes:
    # Critical alerts go to ops channel
    - match:
        severity: critical
      receiver: "critical"
      group_by: ["job"]
      repeat_interval: 30m

    # Warning alerts go to general channel
    - match:
        severity: warning
      receiver: "warning"
      group_by: ["job"]
      repeat_interval: 2h

receivers:
  - name: "default"
    slack_configs:
      - channel: "#monitoring"
        title: "Alert"
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'

  - name: "critical"
    slack_configs:
      - channel: "#critical-alerts"
        title: "🚨 CRITICAL: {{ .GroupLabels.job }}"
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'

  - name: "warning"
    slack_configs:
      - channel: "#alerts"
        title: "⚠️ WARNING: {{ .GroupLabels.job }}"
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'

inhibit_rules:
  # Inhibit warning if critical is already firing
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["job"]

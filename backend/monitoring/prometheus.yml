# prometheus.yml
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:3000"]

  - job_name: "identity-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["identity-service:3001"]

  - job_name: "transaction-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["transaction-service:3002"]

  - job_name: "ocr-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["ocr-service:3003"]

  - job_name: "budget-notification-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["budget-notification-service:3004"]

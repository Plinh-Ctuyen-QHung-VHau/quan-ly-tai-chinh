services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./api-gateway/.env
    networks:
      - microservice-network
    depends_on:
      - identity-service
      - transaction-service
      - ocr-service
      - budget-notification-service
      - finance-intelligence

  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./identity-service/.env
    networks:
      - microservice-network

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - ./transaction-service/.env
    networks:
      - microservice-network

  ocr-service:
    build:
      context: .
      dockerfile: ocr-service/Dockerfile
    ports:
      - "3003:3003"
    env_file:
      - ./ocr-service/.env
    networks:
      - microservice-network

  budget-notification-service:
    build:
      context: .
      dockerfile: budget-notification-service/Dockerfile
    ports:
      - "3004:3004"
    env_file:
      - ./budget-notification-service/.env
    networks:
      - microservice-network

  finance-intelligence:
    build:
      context: .
      dockerfile: finance-intelligence/Dockerfile
    ports:
      - "3006:3006"
    env_file:
      - ./finance-intelligence/.env
    networks:
      - microservice-network

  prometheus:
    image: prom/prometheus:v2.37.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    environment:
      - TZ=UTC
    networks:
      - microservice-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  grafana:
    image: grafana/grafana:8.5.2
    ports:
      - "3005:3000" # Đổi cổng Grafana để tránh xung đột với API Gateway
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/system-overview.json
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - TZ=UTC
    networks:
      - microservice-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - TZ=UTC
    depends_on:
      - prometheus
    networks:
      - microservice-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  microservice-network:
    driver: bridge

version: "3.8"

services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    env_file:
      - ./api-gateway/.env
    networks:
      - microservice-network
    depends_on:
      - identity-service
      - transaction-service
      - ocr-service
      - budget-notification-service

  identity-service:
    build: ./identity-service
    ports:
      - "3001:3001"
    env_file:
      - ./identity-service/.env
    networks:
      - microservice-network

  transaction-service:
    build: ./transaction-service
    ports:
      - "3002:3002"
    env_file:
      - ./transaction-service/.env
    networks:
      - microservice-network

  ocr-service:
    build: ./ocr-service
    ports:
      - "3003:3003"
    env_file:
      - ./ocr-service/.env
    networks:
      - microservice-network

  budget-notification-service:
    build: ./budget-notification-service
    ports:
      - "3004:3004"
    env_file:
      - ./budget-notification-service/.env
    networks:
      - microservice-network

networks:
  microservice-network:
    driver: bridge

version: "3.8"

services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./api-gateway/.env
    volumes:
      - ./api-gateway/src:/app/src
    depends_on:
      - identity-service
      - transaction-service
      - ocr-service
      - budget-notification-service
    networks:
      - app-network

  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    env_file:
      - ./identity-service/.env
    volumes:
      - ./identity-service/src:/app/src
    networks:
      - app-network

  transaction-service:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    env_file:
      - ./transaction-service/.env
    volumes:
      - ./transaction-service/src:/app/src
    networks:
      - app-network

  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    ports:
      - "3003:3000"
    env_file:
      - ./ocr-service/.env
    volumes:
      - ./ocr-service/src:/app/src
    networks:
      - app-network

  budget-notification-service:
    build:
      context: ./budget-notification-service
      dockerfile: Dockerfile
    ports:
      - "3004:3000"
    env_file:
      - ./budget-notification-service/.env
    volumes:
      - ./budget-notification-service/src:/app/src
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
